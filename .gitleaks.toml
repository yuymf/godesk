# GoDesk secret-scan policy (gitleaks >= 8.30, pinned in scripts/gitleaks.lock.json)
#
# Why this file exists: on 2026-10-28 real Cloudflare Zero Trust identifiers
# (account id, Access OIDC issuer, Access application AUD) were committed to this
# PUBLIC repo and only removed by hand afterwards. GitHub push protection cannot
# see them (they are not provider patterns; non-provider patterns are a paid
# feature and this repo is on a free account), so the repo carries its own net:
#   pnpm secrets:check           staged diff, offline  (+ optional git hook)
#   pnpm secrets:check:ci        whole checkout tree, runs in CI
#   pnpm secrets:check:history   full git history, for audits
#   pnpm secrets:check:canary    self-test: rules still fire, allowlist still holds
#
# House rule: never exempt a whole file. Exempt one line shape, and say why in
# the description. `pnpm secrets:check:canary` proves the exemptions stay narrow.

title = "godesk secret scan policy"

[extend]
# keep every upstream rule (generic-api-key is the net for real credentials) and
# add the Cloudflare/GoDesk identifier rules on top
useDefault = true

# --- Zero Trust identifiers: the class of thing that actually leaked ---------

[[rules]]
id = "cloudflare-account-id"
description = "Cloudflare Account ID (32-hex tenant identifier)"
regex = '''(?i)\b(?:account[_-]?id)\b["']?\s*(?:[:=]|\s)\s*["']?([0-9a-f]{32})\b'''
keywords = ["account_id", "account-id", "accountId", "account id"]
secretGroup = 1
tags = ["cloudflare", "identifier", "zero-trust"]

[[rules]]
id = "cloudflare-access-team-domain"
description = "Cloudflare Access team domain (SSO / OIDC issuer host)"
regex = '''https://[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])?\.cloudflareaccess\.com'''
keywords = ["cloudflareaccess.com"]
tags = ["cloudflare", "identifier", "zero-trust"]

[[rules]]
id = "cloudflare-access-oidc-issuer"
description = "Cloudflare Access SaaS OIDC issuer URL (team host + app UUID)"
regex = '''https://[a-z0-9.-]+\.cloudflareaccess\.com/cdn-cgi/access/sso/oidc/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["cdn-cgi/access/sso/oidc"]
tags = ["cloudflare", "identifier", "zero-trust"]

[[rules]]
id = "cloudflare-access-aud"
description = "Cloudflare Access application AUD / OIDC audience tag (64-hex)"
regex = '''(?i)\b(?:GODESK_)?(?:ACCESS_)?AUD(?:IENCE)?\b["']?\s*(?:[:=]|\s)\s*["']?([0-9a-f]{64})\b'''
keywords = ["aud", "audience", "audience\"", "aud="]
secretGroup = 1
tags = ["cloudflare", "identifier", "zero-trust"]

[[rules]]
id = "godesk-env-hex-literal"
description = "GODESK_* var carrying a 32+ hex literal (identifier or credential)"
regex = '''(?i)\bGODESK_[A-Z0-9_]*?(?:AUD|AUDIENCE|SECRET|TOKEN|KEY|ID|ISSUER)\b["']?\s*(?:[:=]|\s)\s*["']?([0-9a-f]{32,})\b'''
keywords = ["godesk_"]
secretGroup = 1
tags = ["godesk", "identifier", "config"]

# --- Allowlist ---------------------------------------------------------------
# regexTarget = "line": a finding is skipped only when the whole *line* matches
# one of these shapes. Paths are deliberately NOT allowlisted, so a real secret
# on any other line of the same file is still reported.

[allowlist]
description = "narrow line shapes (see each regex)"
regexTarget = "line"
regexes = [
  '''(?i)REPLACE_ME[^\s"']*''',
  '''https://godesk-placeholder\.invalid''',
  # enumerated fake Access team hosts used by tests. Keep this list explicit:
  # any *other* team subdomain (i.e. a real one) still reports a finding.
  '''https://(?:test-team|managed-test|godesk-placeholder)\.cloudflareaccess\.com''',
  # `wrangler types` writes its own content hash into line 1 of the typings file
  '''^//\s*Generated by Wrangler\b.*''',
  # JSDoc samples in generated typings / docs
  '''^\s*\*\s*@example\b.*''',
  # per-request dedupe labels in Worker tests/scripts (UUIDs or short slugs)
  '''\bidempotencyKey\b\s*[:=]''',
]
