name: Verify pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: godesk-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:worker
      - run: pnpm typecheck
      - run: pnpm verify:plugin
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
