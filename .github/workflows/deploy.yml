name: Verify and deploy Godesk

# CI minute budget (see docs/ci/actions-budget.md):
# - Docs-only pushes (docs/**, **/*.md, STATUS, prompt-trace) do not deploy.
# - The full Playwright suite already ran on the ready PR head (verify.yml), so
#   main runs build + unit/Worker tests only before deploying. Use
#   "Run workflow" with full_e2e=true to rerun Playwright on main by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/STATUS*"
      - "**/prompt-trace/**"
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Also run the full Playwright suite before deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: godesk-production
  cancel-in-progress: false

jobs:
  verify:
    # Renamed from "Tests and Playwright": push-to-main check, not a PR merge gate.
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/verify-release-records.mjs
      - run: pnpm build
      - run: pnpm test:worker
      - run: pnpm typecheck
      - run: pnpm verify:plugin
      - name: Install Playwright Chromium (manual full_e2e only)
        if: inputs.full_e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright e2e (manual full_e2e only)
        if: inputs.full_e2e
        run: pnpm test:e2e

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.release-record.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Worker runtime secrets (GODESK_SHARE_SECRET, GODESK_WEB_CLIENT_ID,
      # GODESK_WEB_CLIENT_SECRET, …) must be set on the Cloudflare Worker via
      # `wrangler secret put <NAME>` — not as GitHub Actions secrets and never
      # committed here. Missing Worker secrets make this deploy job fail red
      # while verify stays green.
      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is empty. Add an Edit Cloudflare Workers token at Settings → Secrets and variables → Actions, then re-run this workflow. Without it the hobbyist composer never reaches https://godesk.yumengfan220.workers.dev/chatgpt-plugin."
            exit 1
          fi

      - name: Sync Worker OAuth secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GODESK_SHARE_SECRET: ${{ secrets.GODESK_SHARE_SECRET }}
          GODESK_WEB_CLIENT_ID: ${{ secrets.GODESK_WEB_CLIENT_ID }}
          GODESK_WEB_CLIENT_SECRET: ${{ secrets.GODESK_WEB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in GODESK_SHARE_SECRET GODESK_WEB_CLIENT_ID GODESK_WEB_CLIENT_SECRET; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "::error::Repository secret $name is empty"
              exit 1
            fi
            printf '%s' "$val" | pnpm exec wrangler secret put "$name"
          done

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Smoke production composer
        run: pnpm verify:production

      - name: Publish public Plugin
        env:
          GODESK_PLUGIN_SYNC_TOKEN: ${{ secrets.GODESK_PLUGIN_SYNC_TOKEN }}
        run: |
          if [ -z "$GODESK_PLUGIN_SYNC_TOKEN" ]; then
            echo "::error::Repository secret GODESK_PLUGIN_SYNC_TOKEN is empty. Add a PAT with write access to yuymf/godesk-plugin, then re-run this workflow. Production can already be live; this step publishes 0.2.0+codex.20260830 so Codex Marketplace is not the stale 0.1.0 tabletop bundle."
            exit 1
          fi
          node scripts/publish-public-plugin.mjs

      - name: Record deploy identity
        id: release-record
        run: |
          set -euo pipefail
          echo "tag=deploy-$(date -u +%Y.%m.%d)-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  release:
    name: Record release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege: only this job may write repository contents, so the tag
    # and Release are created here instead of widening the deploy job's
    # `contents: read` grant for the whole deploy.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # The deploy job owns the identity: full redeploys get a new attempt,
      # while retrying only this job reuses the successful deploy's tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.deploy.outputs.release_tag }}
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?Deploy release tag is missing}"
          tag="$RELEASE_TAG"
          target="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq "map(select(.ref == \"refs/tags/$tag\")) | .[].object.sha")"
          if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag does not point to deployed commit $GITHUB_SHA"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::Release $tag does not point to deployed commit $GITHUB_SHA"
              exit 1
            fi
            echo "::notice::Release $tag already records $GITHUB_SHA"
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            --notes "Production deploy of ${{ github.sha }} — workflow run ${{ github.run_number }} (https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          echo "::notice::Recorded release $tag for ${{ github.sha }}"
