name: Verify and deploy Godesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godesk-production
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:worker
      - run: pnpm typecheck
      - run: pnpm verify:plugin
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Worker runtime secrets (GODESK_SHARE_SECRET, GODESK_WEB_CLIENT_ID,
      # GODESK_WEB_CLIENT_SECRET, …) must be set on the Cloudflare Worker via
      # `wrangler secret put <NAME>` — not as GitHub Actions secrets and never
      # committed here. Missing Worker secrets make this deploy job fail red
      # while verify stays green.
      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is empty. Add an Edit Cloudflare Workers token at Settings → Secrets and variables → Actions, then re-run this workflow. Without it the hobbyist composer never reaches https://godesk.yumengfan220.workers.dev/chatgpt-plugin."
            exit 1
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Smoke production composer
        run: pnpm verify:production

      - name: Publish public Plugin
        env:
          GODESK_PLUGIN_SYNC_TOKEN: ${{ secrets.GODESK_PLUGIN_SYNC_TOKEN }}
        run: |
          if [ -z "$GODESK_PLUGIN_SYNC_TOKEN" ]; then
            echo "::error::Repository secret GODESK_PLUGIN_SYNC_TOKEN is empty. Add a PAT with write access to yuymf/godesk-plugin, then re-run this workflow. Production can already be live; this step publishes 0.2.0+codex.20260830 so Codex Marketplace is not the stale 0.1.0 tabletop bundle."
            exit 1
          fi
          node scripts/publish-public-plugin.mjs
